name: sparring
version: 1
description: |
  Additive schema that inserts five adversarial persona review artifacts
  between design and tasks. Each persona runs as a separate artifact —
  the human resolves blocking items after each one before continuing.

  Pipeline: PM -> Architect -> UI Designer -> QA Functional -> QA NFQ

  Each artifact generates its own output file in Sparring format.
  tasks is blocked until all five persona artifacts exist.
  Skip a persona by creating its output file manually with a skip note.

  Source: https://github.com/sidgitind/Sparring

artifacts:
  - id: proposal
    generates: proposal.md
    description: Why we are doing this and what changes
    template: proposal.md
    instruction: |
      Create a proposal document covering:
      - The problem being solved and why now
      - What will change and what will not
      - Who is affected
      - One measurable success outcome
    requires: []

  - id: specs
    generates: specs/*.md
    description: Requirements and acceptance criteria
    template: spec.md
    instruction: |
      Create a spec. Each AC must be binary — pass or fail, no interpretation.
      Include: background, what is being built, ACs, out of scope.
      No implementation details. That belongs in design.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical approach and architecture decisions
    template: design.md
    instruction: |
      Create a technical design covering:
      - Module ownership and boundaries
      - External service contracts (timeout, failure shape, retry, state write policy)
      - Data model changes
      - Key decisions and justification
      - Regression surface
    requires:
      - specs

  - id: sparring_pm
    generates: sparring_pm.md
    description: |
      PM persona review — Amazon Working Backwards.
      Interrogates problem definition, customer, success metrics, and scope.
      BLOCK items must be resolved before Architect reviews.
    template: sparring_pm.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.
      If not set: STOP. Report "sparring_library_path not configured.
      Add it to openspec/config.yaml. See openspec-schema/README.md."

      Load the PM persona:
      [sparring_library_path]/Persona/PM_Persona/amazon_pm_working_backwards.md

      Review: specs/*.md and proposal.md

      Run the full persona review per the persona file instructions.
      Write your complete findings into sparring_pm.md using the template.

      HUMAN GATE — after writing sparring_pm.md:
      Present a summary: VERDICT, blocking items, conditional items.
      Instruction to human: resolve all BLOCK items in specs/*.md before
      running /opsx:continue for the Architect persona.
      If no blocking items: human can run /opsx:continue immediately.

      SKIP PROTOCOL — if human created sparring_pm.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - design
      - specs

  - id: sparring_architect
    generates: sparring_architect.md
    description: |
      Architect persona review — Google Distributed Systems.
      Interrogates module boundaries, external service contracts, and blast radius.
      BLOCK items must be resolved before UI Designer reviews.
    template: sparring_architect.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.

      Load the Architect persona:
      [sparring_library_path]/Persona/Architect_Persona/google_distributed_architect.md

      Review: design.md, specs/*.md
      Also read: sparring_pm.md — cross-reference PM findings before reviewing.

      Run the full persona review per the persona file instructions.
      Write your complete findings into sparring_architect.md using the template.

      HUMAN GATE — after writing sparring_architect.md:
      Present a summary: VERDICT, blocking items, conditional items.
      Instruction to human: resolve all BLOCK items in design.md before
      running /opsx:continue for the UI Designer persona.

      SKIP PROTOCOL — if human created sparring_architect.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - sparring_pm

  - id: sparring_ui
    generates: sparring_ui.md
    description: |
      UI Designer persona review — Interaction Clarity.
      Interrogates user states, error messages, loading states, and recovery paths.
      BLOCK items must be resolved before QA Functional reviews.
      Safe to skip for backend-only features with no user-facing states.
    template: sparring_ui.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.

      SKIP CHECK: If this feature has no user-facing states (pure backend, API-only,
      background job), state: "UI Designer — not applicable for this feature type."
      Write that line into sparring_ui.md and stop. Human can run /opsx:continue.

      Otherwise: Load the UI Designer persona:
      [sparring_library_path]/Persona/Designer_Persona/ui_designer_interaction_clarity.md

      Review: specs/*.md and design.md
      Also read: sparring_pm.md, sparring_architect.md — cross-reference prior findings.

      Run the full persona review per the persona file instructions.
      Write your complete findings into sparring_ui.md using the template.

      HUMAN GATE — after writing sparring_ui.md:
      Present a summary: VERDICT, blocking items, conditional items.
      Instruction to human: resolve all BLOCK items in specs/*.md before
      running /opsx:continue for QA Functional.

      SKIP PROTOCOL — if human created sparring_ui.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - sparring_architect

  - id: sparring_qa_functional
    generates: sparring_qa_functional.md
    description: |
      QA Functional persona review — Acceptance Criteria and Path Coverage.
      Interrogates testability, negative paths, and boundary conditions.
      BLOCK items must be resolved before QA NFQ reviews.
    template: sparring_qa_functional.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.

      Load the QA Functional persona:
      [sparring_library_path]/Persona/QA_Persona/qa_functional_path_coverage.md

      Review: specs/*.md (updated after PM, Architect, UI Designer reviews)
      Also read: sparring_pm.md, sparring_architect.md, sparring_ui.md —
      cross-reference prior findings before reviewing.

      Run the full persona review per the persona file instructions.
      Write your complete findings into sparring_qa_functional.md using the template.

      HUMAN GATE — after writing sparring_qa_functional.md:
      Present a summary: VERDICT, blocking items, conditional items.
      Instruction to human: resolve all BLOCK items in specs/*.md before
      running /opsx:continue for QA NFQ.

      SKIP PROTOCOL — if human created sparring_qa_functional.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - sparring_ui

  - id: sparring_qa_nfq
    generates: sparring_qa_nfq.md
    description: |
      QA NFQ persona review — Resilience and Non-Functional Requirements.
      Interrogates timeouts, SLOs, failure visibility, and concurrency.
      BLOCK items must be resolved before tasks are generated.
    template: sparring_qa_nfq.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.

      Load the QA NFQ persona:
      [sparring_library_path]/Persona/QA_Persona/qa_nfq_resilience.md

      Review: specs/*.md and design.md (updated after all prior reviews)
      Also read: sparring_pm.md, sparring_architect.md, sparring_ui.md,
      sparring_qa_functional.md — cross-reference all prior findings.

      Run the full persona review per the persona file instructions.
      Write your complete findings into sparring_qa_nfq.md using the template.

      HUMAN GATE — after writing sparring_qa_nfq.md:
      Present a summary: VERDICT, blocking items, conditional items.
      If any BLOCK items remain: state "PIPELINE BLOCK — resolve before tasks."
      If no BLOCK items: state "PIPELINE PASS — ready for tasks."

      SKIP PROTOCOL — if human created sparring_qa_nfq.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - sparring_qa_functional

  - id: sparring_brief
    generates: sparring_brief.md
    description: |
      Synthesis step -- produces the three-tier SPARRING BRIEF.
      Reads all five persona output files. Deduplicates convergent findings.
      Ranks by surprise value. Produces Tier 1 (verdict), Tier 2 (action index),
      Tier 3 (full reviews). tasks requires this artifact.
    template: sparring_brief.md
    instruction: |
      PRECHECK: Confirm sparring_library_path is set in openspec/config.yaml.

      Load the Synthesis persona:
      [sparring_library_path]/Persona/SPARRING_SYNTHESIS.md

      Read all five persona output files:
        - sparring_pm.md
        - sparring_architect.md
        - sparring_ui.md
        - sparring_qa_functional.md
        - sparring_qa_nfq.md

      Also check for SPARRING_CONTEXT.md in the project root if it exists.

      Run the full Synthesis step per the SPARRING_SYNTHESIS.md instructions:
      1. Aggregate all Tier 1 snippets from persona outputs
      2. Deduplicate -- merge findings where multiple personas flagged the same
         mechanism; name the relationship, keep one finding, note convergence
      3. Rank -- surface highest surprise value first
         (NEW before AMBIENT?; convergent before single-persona)
      4. Produce the three-tier SPARRING BRIEF

      Write findings into sparring_brief.md using the template.

      Present the Tier 1 verdict summary to the human after writing.
      If PIPELINE BLOCK: state which persona and item is blocking.
      If PIPELINE PASS: state "PIPELINE PASS -- ready for tasks."

      SKIP PROTOCOL -- if human created sparring_brief.md manually:
      Check if file contains "SKIPPED". If yes: acknowledge and do not re-run.

    requires:
      - sparring_qa_nfq

  - id: tasks
    generates: tasks.md
    description: Implementation checklist derived from hardened spec
    template: tasks.md
    instruction: |
      PRECHECK — run before generating anything:
      Read each of these files and check for BLOCK verdict or unresolved items:
        - sparring_pm.md
        - sparring_architect.md
        - sparring_ui.md
        - sparring_qa_functional.md
        - sparring_qa_nfq.md

      If any file contains "VERDICT: BLOCK" with unresolved items: STOP.
      Report: "PIPELINE BLOCK — [persona] has unresolved blocking items.
      Resolve them in the spec before generating tasks."

      If any file contains "SKIPPED": note which personas were skipped
      in the tasks.md header. This is the change record.

      If all files show PASS, CONDITIONAL (accepted), or SKIPPED:
      Generate a numbered implementation checklist from the hardened specs
      and design. Each task must be independently completable and verifiable.
      Group by: setup -> core implementation -> error handling ->
      instrumentation -> tests.

    requires:
      - sparring_brief

apply:
  requires: [tasks]
  tracks: tasks.md
